<div class="flex h-screen overflow-hidden bg-slate-50">
  <div class="w-80 shrink-0 bg-white border-r border-slate-200 flex flex-col">
    <div class="p-4 border-b border-slate-200 shrink-0">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-bold text-xl text-slate-900">학습 노트</h2>
        <button
          (click)="newNote()"
          class="p-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition-colors"
        >
          <lucide-icon name="plus" [size]="20" />
        </button>
      </div>
      <div class="relative">
        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
          <lucide-icon name="search" [size]="14" />
        </div>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="노트 검색..."
          class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
        />
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-2 space-y-1">
      @if (isLoading) {
        <div class="flex items-center justify-center py-8">
          <lucide-icon name="loader" [size]="20" color="#6366f1" class="animate-spin" />
        </div>
      }
      @if (!isLoading && filteredNotes.length === 0) {
        <div class="text-center text-sm text-slate-400 py-8">노트가 없습니다</div>
      }
      @for (note of filteredNotes; track note.id) {
        <button
          (click)="selectNote(note, !!note.taskId)"
          [class]="
            activeNoteId === note.id
              ? 'w-full text-left p-3 rounded-xl border bg-indigo-50 border-indigo-100'
              : 'w-full text-left p-3 rounded-xl border border-transparent hover:bg-slate-50'
          "
        >
          <div class="flex items-center gap-1.5 mb-1 min-w-0">
            @if (note.taskId) {
              <lucide-icon name="check-circle-2" [size]="12" color="#6366f1" class="shrink-0" />
            }
            <h3
              [class]="
                activeNoteId === note.id
                  ? 'font-medium text-indigo-900 text-sm truncate'
                  : 'font-medium text-slate-700 text-sm truncate'
              "
            >
              {{ note.title }}
            </h3>
          </div>
          <p class="text-xs text-slate-500 flex items-center gap-1">
            <lucide-icon name="clock" [size]="10" />
            {{ formatDate(note.updatedAt) }}
          </p>
        </button>
      }
    </div>
  </div>

  <div class="flex-1 flex flex-col overflow-hidden">
    <div
      class="h-14 shrink-0 bg-white border-b border-slate-200 flex items-center justify-between px-6 gap-4"
    >
      @if (titleLocked) {
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <lucide-icon name="check-circle-2" [size]="16" color="#6366f1" class="shrink-0" />
          <span class="text-lg font-bold text-slate-900 truncate">{{ title }}</span>
          <span
            class="shrink-0 text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full font-medium"
            >태스크 연동</span
          >
        </div>
      } @else {
        <input
          type="text"
          [(ngModel)]="title"
          placeholder="노트 제목"
          class="flex-1 text-lg font-bold text-slate-900 bg-transparent border-none focus:outline-none focus:ring-0 min-w-0"
        />
      }
      <button
        (click)="save()"
        [disabled]="isSaving"
        class="shrink-0 flex items-center gap-2 px-4 py-2 bg-indigo-900 text-white rounded-lg hover:bg-indigo-800 transition-colors text-sm font-medium disabled:opacity-60"
      >
        <lucide-icon name="save" [size]="15" />
        {{ isSaving ? '저장 중...' : '저장' }}
      </button>
    </div>

    @if (titleLocked) {
      <div class="px-6 py-2 bg-indigo-50 border-b border-indigo-100 flex items-center gap-2">
        <lucide-icon name="info" [size]="14" color="#6366f1" />
        <p class="text-xs text-indigo-600">
          내용을 작성하고 저장하면 해당 태스크가 자동으로 <strong>완료 처리</strong>됩니다.
        </p>
      </div>
    }

    <div class="flex-1 flex overflow-hidden">
      <div class="flex-1 border-r border-slate-200 bg-white overflow-y-auto">
        <textarea
          [(ngModel)]="content"
          class="w-full h-full p-6 resize-none bg-transparent border-none focus:outline-none focus:ring-0 text-slate-700 font-mono text-sm leading-relaxed"
          placeholder="마크다운으로 학습 내용을 작성해보세요..."
        >
        </textarea>
      </div>

      <div class="flex-1 bg-slate-50 overflow-y-auto">
        <div class="markdown p-6 md:p-8 max-w-2xl mx-auto">
          <markdown [data]="content" [disableSanitizer]="true" />
        </div>
      </div>
    </div>
  </div>
</div>
